<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Motivasyon Butonu</title>
<style>
  :root{
    --bg-light:#f0f8ff; --text-light:#111;
    --bg-dark:#000; --text-dark:#fff;
    --error-red:#ff4c4c; --muted:#999;
  }
  body[data-theme="light"]{background:var(--bg-light); color:var(--text-light)}
  body[data-theme="dark"]{background:var(--bg-dark); color:var(--text-dark)}
  body{font-family:Inter, system-ui, Arial; text-align:center; margin:40px 20px; transition:background 0.25s, color 0.25s}
  #topbar{position:fixed; top:12px; right:12px; display:flex; gap:8px; align-items:center}
  #themeToggle{padding:8px 12px; border-radius:8px; border:none; cursor:pointer; background:#666; color:#fff}
  #themeToggle:hover{opacity:0.9}
  #btnImg{width:300px; height:auto; cursor:pointer; transition:transform 0.085s cubic-bezier(.2,.8,.2,1), box-shadow 0.085s; box-shadow:0 8px 24px rgba(0,0,0,0.35); display:block; margin:70px auto 10px}
  #btnImg:active{transform:scale(0.95); box-shadow:0 3px 10px rgba(0,0,0,0.2)}
  #motivation{margin-top:18px; font-size:22px; max-width:820px; margin-left:auto; margin-right:auto; opacity:0; transition:opacity .36s; line-height:1.4}
  #motivation.show{opacity:1}
  #error{margin-top:18px; font-size:15px; color:var(--error-red)}
  #note{margin-top:8px; font-size:13px; color:var(--muted)}
  @media (max-width:420px){ #btnImg{width:88%} #motivation{font-size:18px} }
</style>
</head>
<body data-theme="dark">

<div id="topbar">
  <button id="themeToggle" aria-pressed="false">Aydınlık Mod</button>
</div>

<img id="btnImg" src="kirmizibuton.png" alt="Motivasyon Butonu (kırmızı)" />

<div id="motivation">Sözler yükleniyor...</div>
<div id="error" role="alert" aria-live="polite"></div>
<div id="note"></div>

<script>
(() => {
  const API_URL = 'https://zenquotes.io/api/random';
  const TIMEOUT_MS = 7000;
  const FALLBACK_QUOTES = [
    "Sen bunu yapabilirsin!",
    "Her gün yeni bir fırsattır.",
    "Pes etme, başarı yakındır.",
    "Küçük adımlar büyük fark yaratır.",
    "Hayal et ve harekete geç!",
    "Olumsuzlukları bırak, pozitif ol.",
    "Başarı, azimle gelir.",
    "Kendine inan, mucizeler başlar."
  ];

  const btn = document.getElementById('btnImg');
  const motDiv = document.getElementById('motivation');
  const errorDiv = document.getElementById('error');
  const noteDiv = document.getElementById('note');
  const themeToggle = document.getElementById('themeToggle');

  // Tema toggle
  themeToggle.addEventListener('click', () => {
    const body = document.body;
    if (body.dataset.theme === 'dark') {
      body.dataset.theme = 'light';
      themeToggle.textContent = 'Koyu Mod';
      themeToggle.setAttribute('aria-pressed', 'true');
    } else {
      body.dataset.theme = 'dark';
      themeToggle.textContent = 'Aydınlık Mod';
      themeToggle.setAttribute('aria-pressed', 'false');
    }
  });

  // fetch helper
  async function fetchWithTimeout(url, timeoutMs = TIMEOUT_MS) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  // Yeni söz çek
  async function getQuote() {
    try {
      const data = await fetchWithTimeout(API_URL);
      if (Array.isArray(data) && data[0] && data[0].q) {
        return data[0].q + " — " + (data[0].a || "Anonim");
      }
      throw new Error("Beklenmeyen API yanıtı");
    } catch (err) {
      console.warn("API hatalı:", err);
      errorDiv.textContent = "API hatalı, koddaki mevcut sözler tekrar edecektir";
      if (location.protocol === "file:") {
        noteDiv.textContent = "Not: Dosyayı çift tıklayarak açıyorsan fetch engellenebilir. Local sunucu veya GitHub Pages dene.";
      }
      // fallback'ten rastgele söz
      return FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)];
    }
  }

  // Buton tıklanınca
  btn.addEventListener('click', async () => {
    const quote = await getQuote();
    motDiv.textContent = quote;
    motDiv.classList.remove('show');
    void motDiv.offsetWidth;
    motDiv.classList.add('show');
  });

  // Sayfa açıldığında ilk sözü yükle
  (async () => {
    const firstQuote = await getQuote();
    motDiv.textContent = firstQuote;
    motDiv.classList.add('show');
  })();
})();
</script>

</body>
</html>
