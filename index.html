<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Motivasyon Butonu</title>
<style>
  :root{
    --bg-light:#f0f8ff; --text-light:#111;
    --bg-dark:#000; --text-dark:#fff;
    --error-red:#ff4c4c; --muted:#999;
  }
  body[data-theme="light"]{background:var(--bg-light); color:var(--text-light)}
  body[data-theme="dark"]{background:var(--bg-dark); color:var(--text-dark)}
  body{font-family:Inter, system-ui, Arial; text-align:center; margin:40px 20px; transition:background 0.25s, color 0.25s}
  #topbar{position:fixed; top:12px; right:12px; display:flex; gap:8px; align-items:center}
  #themeToggle{padding:8px 12px; border-radius:8px; border:none; cursor:pointer; background:#666; color:#fff}
  #themeToggle:hover{opacity:0.9}
  #btnImg{width:300px; height:auto; cursor:pointer; transition:transform 0.085s cubic-bezier(.2,.8,.2,1), box-shadow 0.085s; box-shadow:0 8px 24px rgba(0,0,0,0.35); display:block; margin:70px auto 10px}
  #btnImg:active{transform:scale(0.95); box-shadow:0 3px 10px rgba(0,0,0,0.2)}
  #motivation{margin-top:18px; font-size:22px; max-width:820px; margin-left:auto; margin-right:auto; opacity:0; transition:opacity .36s; line-height:1.4}
  #motivation.show{opacity:1}
  #error{margin-top:18px; font-size:15px; color:var(--error-red)}
  #note{margin-top:8px; font-size:13px; color:var(--muted)}
  /* küçük responsive */
  @media (max-width:420px){ #btnImg{width:88%} #motivation{font-size:18px} }
</style>
</head>
<body data-theme="dark">

<div id="topbar">
  <button id="themeToggle" aria-pressed="false">Aydınlık Mod</button>
</div>

<img id="btnImg" src="kirmizibuton.png" alt="Motivasyon Butonu (kırmızı)" />

<div id="motivation">Sözler yükleniyor...</div>
<div id="error" role="alert" aria-live="polite"></div>
<div id="note"></div>

<script>
(() => {
  // ---- Ayarlar ----
  const API_URL = 'https://type.fit/api/quotes';
  const PROXY_RAW = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(API_URL); // fallback proxy
  const TIMEOUT_MS = 7000; // fetch timeout
  const CACHE_KEY = 'motivation_quotes_v1';
  const CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 saatte bir yenile (isteğe göre değiştir)
  const FALLBACK_QUOTES = [
    "Sen bunu yapabilirsin!",
    "Her gün yeni bir fırsattır.",
    "Pes etme, başarı yakındır.",
    "Küçük adımlar büyük fark yaratır.",
    "Hayal et ve harekete geç!",
    "Olumsuzlukları bırak, pozitif ol.",
    "Başarı, azimle gelir.",
    "Kendine inan, mucizeler başlar."
  ];

  // ---- DOM ----
  const btn = document.getElementById('btnImg');
  const motDiv = document.getElementById('motivation');
  const errorDiv = document.getElementById('error');
  const noteDiv = document.getElementById('note');
  const themeToggle = document.getElementById('themeToggle');

  // durum
  let quotes = [...FALLBACK_QUOTES];

  // Tema toggle
  themeToggle.addEventListener('click', () => {
    const body = document.body;
    if (body.dataset.theme === 'dark') {
      body.dataset.theme = 'light';
      themeToggle.textContent = 'Koyu Mod';
      themeToggle.setAttribute('aria-pressed', 'true');
    } else {
      body.dataset.theme = 'dark';
      themeToggle.textContent = 'Aydınlık Mod';
      themeToggle.setAttribute('aria-pressed', 'false');
    }
  });

  // Basınca göster
  btn.addEventListener('click', () => {
    if (!quotes || quotes.length === 0) {
      motDiv.textContent = "Şu anda motivasyon sözleri yüklenemedi.";
    } else {
      const idx = Math.floor(Math.random() * quotes.length);
      motDiv.textContent = quotes[idx];
    }
    motDiv.classList.remove('show');
    void motDiv.offsetWidth;
    motDiv.classList.add('show');
  });

  // helper: fetch with timeout
  async function fetchWithTimeout(url, timeoutMs = TIMEOUT_MS) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  // local cache yönetimi
  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.t || !Array.isArray(parsed.q)) return null;
      if (Date.now() - parsed.t > CACHE_TTL_MS) return null;
      return parsed.q;
    } catch (e) { return null; }
  }
  function saveCache(qs) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), q: qs }));
    } catch (e) { /* ignore */ }
  }

  // ana fonksiyon: önce cache, sonra doğrudan API, sonra proxy, sonunda fallback
  async function loadQuotes() {
    // önce cache kontrolü
    const cached = loadCache();
    if (cached && Array.isArray(cached) && cached.length > 0) {
      quotes = Array.from(new Set(cached)).filter(Boolean);
      errorDiv.textContent = '';
      motDiv.textContent = 'Sözler yüklendi (önbellekten). Butona bas!';
      motDiv.classList.add('show');
      return;
    }

    // gösterge
    motDiv.textContent = 'Sözler yükleniyor...';
    motDiv.classList.add('show');

    // 1) doğrudan API dene
    try {
      const data = await fetchWithTimeout(API_URL);
      if (Array.isArray(data) && data.length > 0) {
        const onlyText = data.map(d => d && (d.text || d.quote) ? (d.text || d.quote) : null).filter(Boolean);
        if (onlyText.length > 0) {
          quotes = Array.from(new Set(onlyText));
          saveCache(quotes);
          errorDiv.textContent = '';
          motDiv.textContent = 'Sözler API üzerinden yüklendi. Butona bas!';
          return;
        } else {
          throw new Error('API boş veri döndü');
        }
      } else {
        throw new Error('API beklenmeyen yanıt');
      }
    } catch (err1) {
      console.warn('Direct fetch failed:', err1);
      // 2) proxy dene (allorigins raw)
      try {
        const data2 = await fetchWithTimeout(PROXY_RAW);
        if (Array.isArray(data2) && data2.length > 0) {
          const onlyText = data2.map(d => d && (d.text || d.quote) ? (d.text || d.quote) : null).filter(Boolean);
          if (onlyText.length > 0) {
            quotes = Array.from(new Set(onlyText));
            saveCache(quotes);
            errorDiv.textContent = '';
            motDiv.textContent = 'Sözler proxy üzerinden yüklendi. Butona bas!';
            return;
          } else {
            throw new Error('Proxy boş veri döndü');
          }
        } else {
          throw new Error('Proxy beklenmeyen yanıt');
        }
      } catch (err2) {
        console.error('Proxy fetch failed:', err2);
        // Hepsi başarısız -> fallback kullan
        quotes = [...FALLBACK_QUOTES];
        // Kullanıcının istediği tam hata mesajı:
        errorDiv.textContent = "API hatalı, koddaki mevcut sözler tekrar edecektir";
        // Eğer dosya protokolündeyse ek not göster
        if (location.protocol === 'file:') {
          noteDiv.textContent = "Not: Dosyayı çift tıklayarak açıyorsan tarayıcı fetch isteklerini engelleyebilir. Local sunucu (python -m http.server) veya GitHub Pages kullanmayı dene.";
        } else {
          noteDiv.textContent = "";
        }
        motDiv.textContent = 'Hazır (fallback). Butona bas!';
        return;
      }
    }
  }

  // başlat
  loadQuotes();
})();
</script>

</body>
</html>
